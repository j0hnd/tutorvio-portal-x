version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=tutorvio
      - DB_USERNAME=tutorvio
      - DB_PASSWORD=tutorvio_password
    depends_on:
      - mariadb

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  mariadb:
    image: mariadb:10.11
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=tutorvio
      - MYSQL_USER=tutorvio
      - MYSQL_PASSWORD=tutorvio_password
      - MYSQL_ROOT_PASSWORD=tutorvio_root_password
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: