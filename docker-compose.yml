version: '3.8'

services:
  backend:
    build:
      context: ./backend
      # Use an appropriate Dockerfile for Laravel
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=tutorvio
      - DB_USERNAME=sail
      - DB_PASSWORD=password
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      # Use an appropriate Dockerfile for Vue+Vite
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=tutorvio
      - POSTGRES_USER=sail
      - POSTGRES_PASSWORD=password
    volumes:
      - tutorvio-pgsql:/var/lib/postgresql/data

volumes:
  tutorvio-pgsql:
